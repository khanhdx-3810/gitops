---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: deploy-notifications
  namespace: flux-system
spec:
  eventSeverity: info
  eventSources:
  - kind: HelmRelease
    name: '*'
    namespace: 'staging'

  - kind: HelmRelease
    name: '*'
    namespace: 'production'

  - kind: ImageUpdateAutomation
    name: '*'
  providerRef:
    name: slack
